pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }

        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "fabric-loom" version new Properties().tap{load(file("gradle.properties").newInputStream())}["loom_version"]
    }
}

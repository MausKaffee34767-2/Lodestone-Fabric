plugins {
    id "fabric-loom"
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
            includeGroup "maven.modrinth"
        }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.minecraft_version}+build.${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}+${project.minecraft_version}"

	modImplementation "maven.modrinth:midnightlib:$midnightlib_version"
	modCompileOnly "maven.modrinth:emi:${project.emi_version}+${project.minecraft_version}+fabric"
	modRuntimeOnly "maven.modrinth:emi:${project.emi_version}+${project.minecraft_version}+fabric"

	modRuntimeOnly "maven.modrinth:carpet:${project.carpet_version}"

}

processResources {
    def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}
/*
tasks.withType(JavaExec).configureEach {
	jvmArgs "-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=127.0.0.1:5005"
}
*/
java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17

	withSourcesJar()
}

loom {
	accessWidenerPath = file("src/main/resources/lodestone.accesswidener")
}
